<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏠 Control de Servicios</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1520;--bg2:#111e2d;--bg3:#162434;--card:#1a2d40;--inp:#0d1a27;--bor:#253d55;--acc:#00d4ff;--grn:#4ade80;--yel:#fbbf24;--red:#f87171;--ora:#fb923c;--pur:#c084fc;--tx:#e2edf7;--tx2:#7da0bb;--tx3:#4a6a80;--r:14px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:16px;}
.hdr{background:linear-gradient(135deg,#081320,#0f2540,#081320);border-bottom:2px solid var(--acc);padding:14px 20px;position:sticky;top:0;z-index:200;box-shadow:0 4px 24px rgba(0,212,255,.12);}
.hdr-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.hdr h1{font-family:'Fredoka One',cursive;font-size:22px;color:var(--acc);text-shadow:0 0 16px rgba(0,212,255,.5);}
.dot{width:9px;height:9px;border-radius:50%;background:var(--yel);box-shadow:0 0 8px var(--yel);display:inline-block;}
.dot.ok{background:var(--grn);box-shadow:0 0 8px var(--grn);}
.dot.err{background:var(--red);box-shadow:0 0 8px var(--red);}
#stxt{font-size:13px;font-weight:700;color:var(--yel);}
.nav{max-width:1000px;margin:20px auto 0;padding:0 16px;display:flex;gap:4px;overflow-x:auto;}
.nav::-webkit-scrollbar{height:0;}
.ntab{padding:9px 18px;border-radius:10px 10px 0 0;font-weight:800;font-size:14px;cursor:pointer;background:var(--card);color:var(--tx3);border:1.5px solid var(--bor);border-bottom:none;white-space:nowrap;transition:all .18s;}
.ntab.active{background:#152840;color:var(--acc);border-color:var(--acc);}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 60px;}
.panel{background:var(--card);border:1.5px solid var(--bor);border-radius:0 var(--r) var(--r) var(--r);padding:22px;}
.ptitle{font-family:'Fredoka One',cursive;font-size:20px;color:var(--acc);margin-bottom:18px;}
/* DASH */
.ms{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.ms select{background:var(--inp);border:1.5px solid var(--bor);color:var(--tx);padding:9px 14px;border-radius:10px;font-family:inherit;font-size:15px;font-weight:700;}
.ms select option{background:#1a2d40;}
.gbar{background:var(--bg3);border:1.5px solid var(--bor);border-radius:var(--r);padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;margin-bottom:22px;}
.gi .gl{font-size:12px;color:var(--tx3);margin-bottom:4px;}
.gi .gv{font-family:'Fredoka One',cursive;font-size:22px;}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.usum{background:var(--bg3);border:1.5px solid var(--bor);border-radius:var(--r);padding:16px;transition:all .2s;}
.usum:hover{border-color:var(--acc);transform:translateY(-2px);}
.un{font-size:18px;font-weight:900;margin-bottom:2px;}
.utot{font-family:'Fredoka One',cursive;font-size:30px;color:var(--yel);margin:8px 0 10px;}
.utot.paid{color:var(--grn);}
.ubr{display:flex;flex-direction:column;gap:4px;}
.ul{display:flex;justify-content:space-between;font-size:13px;color:var(--tx2);}
.ul span:last-child{font-weight:700;color:var(--tx);}
.pbtn{margin-top:10px;width:100%;padding:7px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;border:none;transition:all .2s;}
.pbtn.unp{background:rgba(251,191,36,.15);color:var(--yel);border:1.5px solid rgba(251,191,36,.4);}
.pbtn.pd{background:rgba(74,222,128,.15);color:var(--grn);border:1.5px solid rgba(74,222,128,.4);}
/* REGISTRAR */
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;margin-bottom:20px;}
.uc{background:var(--inp);border:1.5px solid var(--bor);border-radius:var(--r);padding:14px;cursor:pointer;transition:all .18s;}
.uc:hover,.uc.sel{border-color:var(--acc);background:#0f2035;}
.uc.sel{box-shadow:0 0 0 2px var(--acc);}
.ucn{font-size:17px;font-weight:800;margin-bottom:6px;}
.bgs{display:flex;flex-wrap:wrap;gap:4px;}
.bg{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.bluz{background:rgba(0,212,255,.12);color:var(--acc);border:1px solid rgba(0,212,255,.25);}
.bagua{background:rgba(79,195,247,.12);color:#67d5f7;border:1px solid rgba(79,195,247,.25);}
.bcable{background:rgba(251,146,60,.12);color:var(--ora);border:1px solid rgba(251,146,60,.25);}
.binternet{background:rgba(192,132,252,.12);color:var(--pur);border:1px solid rgba(192,132,252,.25);}
.barbitrios{background:rgba(74,222,128,.12);color:var(--grn);border:1px solid rgba(74,222,128,.25);}
.fblk{background:var(--bg3);border:1.5px solid var(--bor);border-radius:var(--r);padding:20px;}
.fbtitle{font-weight:800;font-size:17px;margin-bottom:14px;color:var(--tx2);}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px;margin-bottom:14px;}
.fg{display:flex;flex-direction:column;gap:5px;}
.fg label{font-size:12px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;}
.fg input,.fg select{background:var(--inp);border:1.5px solid var(--bor);color:var(--tx);padding:10px 13px;border-radius:9px;font-size:16px;font-family:inherit;transition:border-color .18s;}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--acc);}
.fg select option{background:#1a2d40;}
.fg .hint{font-size:11px;color:var(--tx3);}
.stabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.stab{padding:8px 16px;border-radius:8px;font-weight:800;font-size:14px;cursor:pointer;border:1.5px solid var(--bor);background:var(--inp);color:var(--tx3);transition:all .18s;}
.stab.active{border-color:var(--acc);color:var(--acc);background:rgba(0,212,255,.08);}
.prev{background:linear-gradient(135deg,#081a2a,#0f2540);border:1.5px solid var(--acc);border-radius:var(--r);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;margin:14px 0;flex-wrap:wrap;gap:10px;}
.pl{font-size:13px;color:var(--tx2);}
.pa{font-family:'Fredoka One',cursive;font-size:32px;color:var(--yel);}
.pd2{font-size:13px;color:var(--tx2);text-align:right;}
/* HISTORIAL */
.fils{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.fils select{background:var(--inp);border:1.5px solid var(--bor);color:var(--tx);padding:8px 13px;border-radius:9px;font-family:inherit;font-size:14px;}
.fils select option{background:#1a2d40;}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px;margin-bottom:18px;}
.sc{background:var(--bg3);border:1.5px solid var(--bor);border-radius:10px;padding:12px;text-align:center;}
.scl{font-size:11px;color:var(--tx3);margin-bottom:3px;}
.scv{font-family:'Fredoka One',cursive;font-size:22px;}
table{width:100%;border-collapse:collapse;font-size:14px;}
thead th{background:#0a1a28;padding:10px 12px;text-align:left;color:var(--tx3);font-size:11px;text-transform:uppercase;letter-spacing:.5px;}
tbody tr{border-bottom:1px solid var(--bor);transition:background .12s;}
tbody tr:hover{background:#1e3045;}
tbody td{padding:10px 12px;}
.tdm{font-weight:800;color:var(--yel);}
/* CONFIG */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:640px){.cgrid{grid-template-columns:1fr;}}
.csec{background:var(--bg3);border:1.5px solid var(--bor);border-radius:var(--r);padding:16px;}
.csec h3{font-size:15px;font-weight:800;color:var(--tx2);margin-bottom:12px;}
.cuc{background:var(--inp);border:1.5px solid var(--bor);border-radius:10px;padding:14px;margin-bottom:10px;}
.cun{font-size:16px;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.cpg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.cpi{display:flex;flex-direction:column;gap:3px;}
.cpi label{font-size:11px;color:var(--tx3);font-weight:700;text-transform:uppercase;}
.cpi input{background:var(--bg3);border:1.5px solid var(--bor);color:var(--tx);padding:6px 10px;border-radius:7px;font-family:inherit;font-size:14px;font-weight:700;width:100%;}
.cpi input:focus{outline:none;border-color:var(--acc);}
.csvcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.schk{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;cursor:pointer;padding:3px 8px;border-radius:6px;border:1.5px solid var(--bor);background:var(--bg3);transition:all .15s;}
.schk input{width:14px;height:14px;cursor:pointer;}
/* BTN */
.btn{padding:9px 18px;border-radius:9px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;cursor:pointer;border:none;transition:all .18s;}
.btn:hover{transform:translateY(-1px);}
.btnp{background:var(--acc);color:#081320;}
.btng{background:var(--grn);color:#081320;}
.btnr{background:var(--red);color:white;}
.btno{background:transparent;border:1.5px solid var(--bor);color:var(--tx2);}
.btno:hover{border-color:var(--acc);color:var(--acc);}
.btnsm{padding:4px 11px;font-size:12px;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1.5px solid var(--grn);color:var(--tx);padding:12px 20px;border-radius:11px;font-weight:700;font-size:14px;z-index:9999;transform:translateY(80px);opacity:0;transition:all .28s;box-shadow:0 8px 32px rgba(0,0,0,.35);max-width:300px;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.err{border-color:var(--red);}
.div{height:1px;background:var(--bor);margin:18px 0;}
.load{text-align:center;padding:32px;color:var(--tx3);}
.empty{text-align:center;padding:32px;color:var(--tx3);font-size:15px;}
@media(max-width:480px){.hdr h1{font-size:18px;}.panel{padding:14px;}.fgrid{grid-template-columns:1fr 1fr;}.dgrid{grid-template-columns:1fr 1fr;}.ugrid{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-in">
    <h1>🏠 Control de Servicios</h1>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="dot" id="dot"></div>
      <span id="stxt">Conectando...</span>
    </div>
  </div>
</div>
<div class="nav">
  <div class="ntab active" onclick="showTab('dashboard')">🏠 Resumen</div>
  <div class="ntab" onclick="showTab('registrar')">📝 Registrar</div>
  <div class="ntab" onclick="showTab('historial')">📊 Historial</div>
  <div class="ntab" onclick="showTab('config')">⚙️ Config</div>
</div>
<div class="wrap">
  <!-- DASHBOARD -->
  <div id="tab-dashboard" class="panel">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;">
      <div class="ptitle" style="margin-bottom:0">🏠 Resumen del mes</div>
      <div class="ms">
        <select id="dmes"></select>
        <select id="danio"><option value="2024">2024</option><option value="2025">2025</option><option value="2026" selected>2026</option></select>
        <button class="btn btno" onclick="cargarTodo()">🔄</button>
      </div>
    </div>
    <div class="gbar" id="gbar"></div>
    <div class="dgrid" id="dgrid"><div class="load">Cargando...</div></div>
  </div>
  <!-- REGISTRAR -->
  <div id="tab-registrar" class="panel" style="display:none">
    <div class="ptitle">📝 Registrar servicio</div>
    <div class="ugrid" id="ugrid"><div class="load">Cargando...</div></div>
    <div id="fwrap" style="display:none">
      <div class="fblk">
        <div class="fbtitle" id="ftitle">Selecciona servicio</div>
        <div class="fgrid">
          <div class="fg"><label>📅 Mes</label><select id="fmes"></select></div>
          <div class="fg"><label>📅 Año</label><select id="fanio"><option value="2024">2024</option><option value="2025">2025</option><option value="2026" selected>2026</option></select></div>
        </div>
        <div style="font-size:12px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;">Servicio</div>
        <div class="stabs" id="stabs"></div>
        <div id="sfields"></div>
        <div class="prev">
          <div><div class="pl">Monto a registrar</div><div class="pa" id="pmonto">S/ 0.00</div></div>
          <div class="pd2" id="pdet"></div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btng" onclick="guardarRegistro()" style="font-size:16px;padding:12px 26px">💾 Guardar</button>
          <button class="btn btno" onclick="cancelForm()">Cancelar</button>
        </div>
      </div>
    </div>
  </div>
  <!-- HISTORIAL -->
  <div id="tab-historial" class="panel" style="display:none">
    <div class="ptitle">📊 Historial</div>
    <div class="fils">
      <select id="fu" onchange="filtrar()"><option value="">Todos</option></select>
      <select id="fm" onchange="filtrar()">
        <option value="">Todos los meses</option>
        <option value="01">Enero</option><option value="02">Febrero</option><option value="03">Marzo</option>
        <option value="04">Abril</option><option value="05">Mayo</option><option value="06">Junio</option>
        <option value="07">Julio</option><option value="08">Agosto</option><option value="09">Setiembre</option>
        <option value="10">Octubre</option><option value="11">Noviembre</option><option value="12">Diciembre</option>
      </select>
      <select id="fa" onchange="filtrar()"><option value="">Todos los años</option><option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option></select>
      <select id="fs" onchange="filtrar()">
        <option value="">Todos los servicios</option>
        <option value="luz">⚡ Luz</option><option value="agua">💧 Agua</option>
        <option value="arbitrios">🏛️ Arbitrios</option><option value="cable">📺 Cable</option><option value="internet">🌐 Internet</option>
      </select>
      <button class="btn btno" onclick="loadHist()">🔄</button>
    </div>
    <div class="scards" id="scards"></div>
    <div id="tbl"><div class="load">Cargando...</div></div>
  </div>
  <!-- CONFIG -->
  <div id="tab-config" class="panel" style="display:none">
    <div class="ptitle">⚙️ Configuración de usuarios</div>
    <div id="cfgu"><div class="load">Cargando...</div></div>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;align-items:flex-end;">
      <div class="fg" style="flex:1;min-width:160px"><label>Nombre nuevo usuario</label><input type="text" id="nnombre" placeholder="Ej: Principal"></div>
      <button class="btn btnp" onclick="addUser()">+ Agregar</button>
    </div>
    <div class="div"></div>
    <button class="btn btng" onclick="saveConfig()" style="font-size:16px;padding:12px 26px;width:100%">💾 Guardar todos los cambios</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const URL = 'https://script.google.com/macros/s/AKfycbx41x2e3iQt6Tm53dZayJLk4wx_cPCo9CsA6vC_ZnT9CBOv-oTwf4XdVA1fHz-tnQhJsQ/exec';
const MES = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Setiembre','Octubre','Noviembre','Diciembre'];
const SVCS = ['luz','agua','arbitrios','cable','internet'];
const ICON = {luz:'⚡',agua:'💧',arbitrios:'🏛️',cable:'📺',internet:'🌐'};
const CLR = {luz:'var(--acc)',agua:'#67d5f7',arbitrios:'var(--grn)',cable:'var(--ora)',internet:'var(--pur)'};

let usuarios=[], historial=[], uSel=null, sSel=null;

// ====== JSONP API ======
function api(params) {
  return new Promise((res, rej) => {
    const cb = '__cb' + Date.now() + Math.floor(Math.random()*1000);
    const s = document.createElement('script');
    const t = setTimeout(() => {
      cleanup(); rej(new Error('Timeout'));
    }, 15000);
    function cleanup() {
      clearTimeout(t);
      delete window[cb];
      if (s.parentNode) s.parentNode.removeChild(s);
    }
    window[cb] = (data) => { cleanup(); res(data); };
    s.onerror = () => { cleanup(); rej(new Error('Error de red')); };
    const p = new URLSearchParams({...params, callback: cb});
    s.src = URL + '?' + p.toString();
    document.head.appendChild(s);
  });
}

// ====== INIT ======
window.onload = () => {
  fillMes(['dmes','fmes']);
  setMesActual();
  cargarTodo();
};

function fillMes(ids) {
  const m = new Date().getMonth()+1;
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    for (let i=1;i<=12;i++) {
      const o = document.createElement('option');
      o.value = String(i).padStart(2,'0');
      o.textContent = MES[i];
      if (i===m) o.selected=true;
      el.appendChild(o);
    }
  });
}

function setMesActual() {
  const m = String(new Date().getMonth()+1).padStart(2,'0');
  const a = String(new Date().getFullYear());
  const fm=document.getElementById('fm'), fa=document.getElementById('fa');
  if(fm) fm.value=m;
  if(fa) fa.value=a;
}

async function cargarTodo() {
  setSt('Conectando...','var(--yel)','');
  try {
    const [ru, rh] = await Promise.all([api({action:'getUsuarios'}), api({action:'getHistorial'})]);
    if (!ru.success) throw new Error(ru.message);
    usuarios = (ru.usuarios||[]).map(u=>({...u, precioKw:parseFloat(u.precioKw)||0.80, precioAgua:parseFloat(u.precioAgua)||0, servicios:u.servicios||'luz,agua,arbitrios,cable,internet'}));
    historial = rh.success ? (rh.registros||[]) : [];
    setSt('Conectado','var(--grn)','ok');
    renderUgrid(); renderDash(); renderFU(); renderCfg();
  } catch(e) {
    setSt('Sin conexión','var(--red)','err');
    toast('❌ Error: '+e.message, true);
  }
}

function setSt(txt, color, cls) {
  document.getElementById('stxt').textContent=txt;
  document.getElementById('stxt').style.color=color;
  document.getElementById('dot').className='dot'+(cls?' '+cls:'');
}

// ====== TABS ======
function showTab(t) {
  ['dashboard','registrar','historial','config'].forEach(x=>document.getElementById('tab-'+x).style.display=x===t?'block':'none');
  document.querySelectorAll('.ntab').forEach((el,i)=>el.classList.toggle('active',['dashboard','registrar','historial','config'][i]===t));
  if(t==='historial') loadHist();
  if(t==='config') renderCfg();
}

// ====== DASHBOARD ======
function renderDash() {
  const mes=document.getElementById('dmes').value, anio=document.getElementById('danio').value;
  const md = historial.filter(r=>String(r.mes).padStart(2,'0')===mes && String(r.anio)===anio);
  const tot=md.reduce((s,r)=>s+(r.monto||0),0);
  const pag=md.filter(r=>r.pagado).reduce((s,r)=>s+(r.monto||0),0);
  const pnd=tot-pag;
  const bySvc={};
  SVCS.forEach(s=>{bySvc[s]=md.filter(r=>r.servicio===s).reduce((sum,r)=>sum+(r.monto||0),0);});
  document.getElementById('gbar').innerHTML=`
    <div class="gi"><div class="gl">💰 Total</div><div class="gv" style="color:var(--yel)">S/ ${tot.toFixed(2)}</div></div>
    <div class="gi"><div class="gl">Cobrado</div><div class="gv" style="color:var(--grn)">S/ ${pag.toFixed(2)}</div></div>
    <div class="gi"><div class="gl">⏳ Pendiente</div><div class="gv" style="color:var(--red)">S/ ${pnd.toFixed(2)}</div></div>
    ${SVCS.filter(s=>bySvc[s]>0).map(s=>`<div class="gi"><div class="gl">${ICON[s]} ${s}</div><div class="gv" style="color:${CLR[s]}">S/ ${bySvc[s].toFixed(2)}</div></div>`).join('')}
  `;
  if (!usuarios.length) { document.getElementById('dgrid').innerHTML='<div class="empty">Sin usuarios — Ve a Config</div>'; return; }
  document.getElementById('dgrid').innerHTML=usuarios.map(u=>{
    const ud=md.filter(r=>r.usuario===u.nombre);
    const ut=ud.reduce((s,r)=>s+(r.monto||0),0);
    const up=ud.filter(r=>r.pagado).reduce((s,r)=>s+(r.monto||0),0);
    const isPaid=ut>0&&up>=ut;
    const br=SVCS.map(s=>{const v=ud.filter(r=>r.servicio===s).reduce((sum,r)=>sum+(r.monto||0),0);return v>0?`<div class="ul"><span>${ICON[s]} ${s}</span><span>S/ ${v.toFixed(2)}</span></div>`:''}).join('');
    return `<div class="usum">
      <div class="un">${u.nombre}</div>
      <div class="utot ${isPaid?'paid'}">${ut>0?'S/ '+ut.toFixed(2):'---'}</div>
      <div class="ubr">${br||'<div style="font-size:13px;color:var(--tx3)">Sin registros</div>'}</div>
      ${ut>0?`<button class="pbtn ${isPaid?'pd':'unp'}" onclick="togglePago('${u.nombre}','${mes}','${anio}')">${isPaid?'Cobrado':'⏳ Marcar cobrado'}</button>`:''}
    </div>`;
  }).join('');
}

async function togglePago(nombre, mes, anio) {
  const ud=historial.filter(r=>r.usuario===nombre&&String(r.mes).padStart(2,'0')===mes&&String(r.anio)===anio);
  const yaPagado=ud.length>0&&ud.every(r=>r.pagado);
  try {
    await api({action:'setPagado',usuario:nombre,mes,anio,pagado:yaPagado?'0':'1'});
    const rh=await api({action:'getHistorial'});
    if(rh.success) historial=rh.registros||[];
    renderDash();
    toast(yaPagado?'Pendiente':'Cobrado');
  } catch(e){toast('❌ Error',true);}
}

// ====== REGISTRAR ======
function renderUgrid() {
  const g=document.getElementById('ugrid');
  if(!usuarios.length){g.innerHTML='<div class="empty">Sin usuarios. Ve a Config.</div>';return;}
  g.innerHTML=usuarios.map((u,i)=>{
    const sv=(u.servicios||'').split(',').map(s=>s.trim()).filter(Boolean);
    return `<div class="uc" id="uc${i}" onclick="selUser(${i})">
      <div class="ucn">${u.nombre}</div>
      <div class="bgs">
        ${sv.includes('luz')?'<span class="bg bluz">⚡ Luz</span>':''}
        ${sv.includes('agua')?'<span class="bg bagua">💧 Agua</span>':''}
        ${sv.includes('arbitrios')?'<span class="bg barbitrios">🏛️</span>':''}
        ${sv.includes('cable')?'<span class="bg bcable">📺</span>':''}
        ${sv.includes('internet')?'<span class="bg binternet">🌐</span>':''}
      </div>
    </div>`;
  }).join('');
}

function selUser(i) {
  uSel=i; sSel=null;
  document.querySelectorAll('.uc').forEach((c,j)=>c.classList.toggle('sel',j===i));
  const u=usuarios[i];
  document.getElementById('ftitle').textContent='Registrando para: '+u.nombre;
  const sv=(u.servicios||'').split(',').map(s=>s.trim()).filter(Boolean);
  document.getElementById('stabs').innerHTML=sv.map(s=>`<div class="stab" id="stab_${s}" onclick="selSvc('${s}')">${ICON[s]} ${s.charAt(0).toUpperCase()+s.slice(1)}</div>`).join('');
  document.getElementById('sfields').innerHTML='';
  document.getElementById('pmonto').textContent='S/ 0.00';
  document.getElementById('pdet').textContent='';
  document.getElementById('fwrap').style.display='block';
  if(sv.length>0) selSvc(sv[0]);
  document.getElementById('fwrap').scrollIntoView({behavior:'smooth',block:'start'});
}

function selSvc(s) {
  sSel=s;
  document.querySelectorAll('.stab').forEach(t=>t.classList.remove('active'));
  const tab=document.getElementById('stab_'+s);
  if(tab) tab.classList.add('active');
  renderSvcFields(s);
}

function renderSvcFields(s) {
  const u=usuarios[uSel];
  let h='';
  if(s==='luz') {
    h=`<div class="fgrid">
      <div class="fg"><label>📟 Lectura anterior (kWh)</label><input type="number" id="slant" placeholder="Ej: 1250" min="0" step="0.1" oninput="calcSvc()"><span class="hint">Lectura del mes pasado</span></div>
      <div class="fg"><label>📟 Lectura actual (kWh)</label><input type="number" id="slact" placeholder="Ej: 1370" min="0" step="0.1" oninput="calcSvc()"><span class="hint">Lectura de hoy</span></div>
      <div class="fg"><label>💰 Precio por kWh (S/)</label><input type="number" id="sprecio" value="${u.precioKw||0.80}" step="0.01" min="0" oninput="calcSvc()"><span class="hint">Precio de ${u.nombre}</span></div>
    </div>`;
  } else {
    const lbl={agua:'Mayo 2026',arbitrios:'Arbitrios municipales',cable:'Cable TV mensual',internet:'Internet mensual'};
    h=`<div class="fgrid">
      <div class="fg"><label>💰 Monto (S/)</label><input type="number" id="smonto" placeholder="Ej: 45.00" min="0" step="0.01" oninput="calcSvc()"></div>
      <div class="fg"><label>📝 Detalle</label><input type="text" id="sdet" placeholder="${lbl[s]||s}"></div>
    </div>`;
  }
  document.getElementById('sfields').innerHTML=h;
  calcSvc();
}

function calcSvc() {
  if(!sSel) return;
  let monto=0, det='';
  if(sSel==='luz') {
    const ant=parseFloat(document.getElementById('slant')?.value)||0;
    const act=parseFloat(document.getElementById('slact')?.value)||0;
    const p=parseFloat(document.getElementById('sprecio')?.value)||0.80;
    const c=Math.max(0,act-ant);
    monto=c*p;
    if(c>0) det=`Consumo: ${c.toFixed(1)} kWh × S/${p.toFixed(2)}`;
    else if(act>0&&ant>0&&act<ant) det='⚠️ Lectura actual menor que anterior';
  } else {
    monto=parseFloat(document.getElementById('smonto')?.value)||0;
  }
  document.getElementById('pmonto').textContent=`S/ ${monto.toFixed(2)}`;
  document.getElementById('pdet').textContent=det;
}

function cancelForm() {
  uSel=null; sSel=null;
  document.getElementById('fwrap').style.display='none';
  document.querySelectorAll('.uc').forEach(c=>c.classList.remove('sel'));
}

async function guardarRegistro() {
  const u=usuarios[uSel];
  const mes=document.getElementById('fmes').value;
  const anio=document.getElementById('fanio').value;
  let monto=0, det='';
  if(sSel==='luz') {
    const ant=parseFloat(document.getElementById('slant')?.value)||0;
    const act=parseFloat(document.getElementById('slact')?.value)||0;
    const p=parseFloat(document.getElementById('sprecio')?.value)||0.80;
    if(act<=0){toast('⚠️ Ingresa la lectura actual',true);return;}
    if(act<ant){toast('⚠️ Lectura actual menor que anterior',true);return;}
    const c=act-ant;
    monto=c*p;
    det=`Ant:${ant} Act:${act} Consumo:${c.toFixed(1)}kWh x S/${p.toFixed(2)}`;
  } else {
    monto=parseFloat(document.getElementById('smonto')?.value)||0;
    det=document.getElementById('sdet')?.value||'';
  }
  if(monto<=0){toast('⚠️ Monto debe ser mayor a 0',true);return;}
  try {
    const r=await api({action:'addConsumo',usuario:u.nombre,mes,anio,servicio:sSel,detalle:det,monto:monto.toFixed(2)});
    if(r.success){
      toast(`✅ ${ICON[sSel]} S/ ${monto.toFixed(2)} guardado`);
      cancelForm();
      const rh=await api({action:'getHistorial'});
      if(rh.success) historial=rh.registros||[];
      renderDash();
    } else toast('❌ '+r.message,true);
  } catch(e){toast('❌ Error de conexión',true);}
}

// ====== HISTORIAL ======
async function loadHist() {
  document.getElementById('tbl').innerHTML='<div class="load">⏳ Cargando...</div>';
  try {
    const r=await api({action:'getHistorial'});
    if(r.success){historial=r.registros||[];renderHist();}
  } catch(e){document.getElementById('tbl').innerHTML='<div class="empty">❌ Error de conexión</div>';}
}

function filtrar(){renderHist();}

function renderFU() {
  const s=document.getElementById('fu');
  const cur=s.value;
  s.innerHTML='<option value="">Todos los usuarios</option>'+usuarios.map(u=>`<option value="${u.nombre}" ${u.nombre===cur?'selected':''}>${u.nombre}</option>`).join('');
}

function renderHist() {
  const fU=document.getElementById('fu').value, fM=document.getElementById('fm').value;
  const fA=document.getElementById('fa').value, fS=document.getElementById('fs').value;
  let data=historial.filter(r=>{
    if(fU&&r.usuario!==fU)return false;
    if(fM&&String(r.mes).padStart(2,'0')!==fM)return false;
    if(fA&&String(r.anio)!==fA)return false;
    if(fS&&r.servicio!==fS)return false;
    return true;
  });
  const tot=data.reduce((s,r)=>s+(r.monto||0),0);
  const bS={};SVCS.forEach(s=>{bS[s]=data.filter(r=>r.servicio===s).reduce((sum,r)=>sum+(r.monto||0),0);});
  document.getElementById('scards').innerHTML=`
    <div class="sc"><div class="scl">💰 Total</div><div class="scv" style="color:var(--yel)">S/ ${tot.toFixed(2)}</div></div>
    ${SVCS.filter(s=>bS[s]>0).map(s=>`<div class="sc"><div class="scl">${ICON[s]} ${s}</div><div class="scv" style="color:${CLR[s]}">S/ ${bS[s].toFixed(2)}</div></div>`).join('')}
    <div class="sc"><div class="scl">📋 Registros</div><div class="scv">${data.length}</div></div>
  `;
  renderFU();
  if(!data.length){document.getElementById('tbl').innerHTML='<div class="empty">Sin registros</div>';return;}
  const rows=[...data].reverse().map(r=>`<tr>
    <td><strong>${r.usuario}</strong></td>
    <td>${MES[parseInt(r.mes)]||r.mes} ${r.anio}</td>
    <td style="color:${CLR[r.servicio]||'var(--tx)'}">${ICON[r.servicio]||''} ${r.servicio}</td>
    <td style="color:var(--tx2);font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.detalle||'-'}</td>
    <td class="tdm">S/ ${(r.monto||0).toFixed(2)}</td>
    <td style="color:${r.pagado?'var(--grn)':'var(--tx3)'};font-size:12px;font-weight:700">${r.pagado?'✅':'---'}</td>
    <td><button class="btn btnr btnsm" onclick="delReg(${r.fila})">🗑️</button></td>
  </tr>`).join('');
  document.getElementById('tbl').innerHTML=`<div style="overflow-x:auto"><table>
    <thead><tr><th>Usuario</th><th>Período</th><th>Servicio</th><th>Detalle</th><th>Monto</th><th>Estado</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

async function delReg(fila) {
  if(!confirm('¿Eliminar registro?'))return;
  try{
    const r=await api({action:'deleteRegistro',fila});
    if(r.success){toast('🗑️ Eliminado');const rh=await api({action:'getHistorial'});if(rh.success)historial=rh.registros||[];renderHist();renderDash();}
    else toast('❌ '+r.message,true);
  }catch(e){toast('❌ Error',true);}
}

// ====== CONFIG ======
function renderCfg() {
  if(!usuarios.length){document.getElementById('cfgu').innerHTML='<div class="empty">Sin usuarios</div>';return;}
  document.getElementById('cfgu').innerHTML=usuarios.map((u,i)=>{
    const sv=(u.servicios||'').split(',').map(s=>s.trim()).filter(Boolean);
    return `<div class="cuc">
      <div class="cun"><span>${u.nombre}</span><button class="btn btnr btnsm" onclick="delUser('${u.nombre}')">✕ Eliminar</button></div>
      <div class="cpg">
        <div class="cpi"><label>⚡ Precio kWh (S/)</label><input type="number" id="ckw${i}" value="${u.precioKw||0.80}" step="0.01" min="0" placeholder="0.80"></div>
        <div class="cpi"><label>💧 Precio Agua (S/)</label><input type="number" id="cagua${i}" value="${u.precioAgua||0}" step="0.01" min="0" placeholder="0"></div>
      </div>
      <div style="font-size:11px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Servicios activos</div>
      <div class="csvcs">${SVCS.map(s=>`<label class="schk"><input type="checkbox" id="cs${i}_${s}" ${sv.includes(s)?'checked':''}> ${ICON[s]} ${s}</label>`).join('')}</div>
    </div>`;
  }).join('');
}

async function saveConfig() {
  const updated=usuarios.map((u,i)=>{
    const kw=parseFloat(document.getElementById(`ckw${i}`)?.value)||0.80;
    const agua=parseFloat(document.getElementById(`cagua${i}`)?.value)||0;
    const sv=SVCS.filter(s=>document.getElementById(`cs${i}_${s}`)?.checked).join(',');
    return {...u,precioKw:kw,precioAgua:agua,servicios:sv};
  });
  try{
    await Promise.all(updated.map(u=>api({action:'updateUsuario',nombre:u.nombre,servicios:u.servicios,precioKw:u.precioKw,precioAgua:u.precioAgua})));
    usuarios=updated; renderUgrid(); renderCfg();
    toast('✅ Configuración guardada');
  }catch(e){toast('❌ Error al guardar',true);}
}

async function addUser() {
  const n=document.getElementById('nnombre').value.trim();
  if(!n){toast('⚠️ Escribe un nombre',true);return;}
  try{
    const r=await api({action:'addUsuario',nombre:n,servicios:'luz,agua,arbitrios,cable,internet',precioKw:0.80,precioAgua:0});
    if(r.success){toast('✅ Usuario agregado');document.getElementById('nnombre').value='';await cargarTodo();}
    else toast('❌ '+r.message,true);
  }catch(e){toast('❌ Error',true);}
}

async function delUser(nombre) {
  if(!confirm(`¿Eliminar "${nombre}"?`))return;
  try{
    const r=await api({action:'deleteUsuario',nombre});
    if(r.success){toast('🗑️ Eliminado');await cargarTodo();}
    else toast('❌ '+r.message,true);
  }catch(e){toast('❌ Error',true);}
}

function toast(msg,err=false){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.toggle('err',err);
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);
}
</script>
